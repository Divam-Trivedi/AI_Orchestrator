<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Orchestrator</title>
    
    <!-- Tailwind & Configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        blackBg: '#000000',
                        grayPanel: '#121212',
                        grayBorder: '#262626',
                        accent: '#ffffff', 
                        accentText: '#000000' 
                    }
                }
            }
        }
    </script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <!-- External Library Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body);"></script>
    
    <!-- Marked Options Script (Small enough to keep here or move to JS) -->
    <script>
        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlightAuto(code).value;
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true 
        });
    </script>
</head>
<body class="bg-white dark:bg-blackBg text-slate-900 dark:text-zinc-100 h-screen flex overflow-hidden transition-colors duration-200">

    <aside id="sidebar" class="w-64 bg-slate-100 dark:bg-grayPanel flex flex-col border-r border-slate-200 dark:border-grayBorder transition-all duration-300">
        <div class="p-4 space-y-2">
            <button onclick="newChat()" class="w-full py-2 px-4 bg-accent text-accentText rounded-lg font-bold hover:opacity-90 transition-opacity">+ New Chat</button>
            <button onclick="openCreateGroupModal()" class="w-full py-2 px-4 bg-slate-300 dark:bg-slate-700 text-slate-900 dark:text-slate-100 rounded-lg font-bold hover:opacity-90 transition-opacity text-sm">+ Create Group</button>
        </div>
        <div id="history-list" class="flex-1 overflow-y-auto custom-scrollbar px-2 space-y-1"></div>

        <div class="p-4 border-t border-slate-200 dark:border-grayBorder flex flex-col gap-2">
            <button onclick="toggleSettings(true)" class="flex items-center gap-2 text-sm opacity-70 hover:opacity-100">⚙️ API Keys Control</button>
            <button onclick="toggleHub(true)" class="flex items-center gap-2 text-sm opacity-70 hover:opacity-100">🚀 More</button>
        </div>

    </aside>

    <main class="flex-1 flex flex-col relative">
        <header class="h-16 border-b border-slate-200 dark:border-grayBorder flex items-center justify-between px-6 bg-white/50 dark:bg-blackBg/50 backdrop-blur-md">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="p-2 text-xl">☰</button>
                <select id="model-select" class="bg-transparent text-sm font-medium outline-none cursor-pointer hover:text-accent"></select>
            </div>
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-2 text-xs">
                    <div class="w-48 h-2 bg-slate-300 dark:bg-slate-700 rounded-full overflow-hidden">
                        <div id="token-bar" class="h-full w-full flex flex-nowrap"></div>
                    </div>
                    <span id="token-text">0 tokens</span>
                </div>
                <button onclick="toggleContextWindow()" class="text-sm px-3 py-1 rounded bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700">Context</button>
                <button onclick="toggleSystemPromptDropdown()" class="text-sm px-3 py-1 rounded bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700" id="system-prompt-btn">Behavior: Default</button>
                <button onclick="toggleWebSearch()" id="web-search-btn" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 opacity-50" title="Web Search">🔍</button>
                <button onclick="toggleTheme()" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800">🌓</button>
            </div>
        </header>

        <div id="context-modal" class="hidden absolute top-16 right-1/3 bg-white dark:bg-grayPanel p-4 rounded-lg border border-slate-200 dark:border-grayBorder shadow-lg z-40 w-80">
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <span class="font-bold text-sm">Context Mode</span>
                    <button onclick="toggleContextPreview()" class="text-xs px-2 py-1 rounded bg-blue-500 text-white hover:bg-blue-600">Preview</button>
                </div>
                <div class="flex items-center gap-2">
                    <input type="radio" id="ctx-all" name="context" value="all" checked onchange="updateContextMode()">
                    <label for="ctx-all" class="text-sm">All messages</label>
                </div>
                <div id="ctx-last-group" class="">
                    <div class="flex items-center gap-2 mb-2">
                        <input type="radio" id="ctx-last" name="context" value="last_n" onchange="updateContextMode()">
                        <label for="ctx-last" class="text-sm">Last N messages</label>
                    </div>
                    <div class="flex gap-2 items-center">
                        <input type="range" id="ctx-n" min="1" max="50" value="10" class="flex-1" oninput="updateContextDisplay('n')">
                        <span id="ctx-n-display" class="text-sm font-bold w-8">10</span>
                    </div>
                </div>
                <div id="ctx-both-group" class="">
                    <div class="flex items-center gap-2 mb-2">
                        <input type="radio" id="ctx-both" name="context" value="first_m_last_n" onchange="updateContextMode()">
                        <label for="ctx-both" class="text-sm">First M + Last N</label>
                    </div>
                    <div class="space-y-2">
                        <div class="flex gap-2 items-center">
                            <label class="text-xs w-8">M:</label>
                            <input type="range" id="ctx-m" min="0" max="50" value="0" class="flex-1" oninput="updateContextDisplay('m')">
                            <span id="ctx-m-display" class="text-sm font-bold w-8">0</span>
                        </div>
                        <div class="flex gap-2 items-center">
                            <label class="text-xs w-8">N:</label>
                            <input type="range" id="ctx-n2" min="1" max="50" value="10" class="flex-1" oninput="updateContextDisplay('n2')">
                            <span id="ctx-n2-display" class="text-sm font-bold w-8">10</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="system-prompt-dropdown" class="hidden absolute top-16 right-1/4 bg-white dark:bg-grayPanel p-4 rounded-lg border border-slate-200 dark:border-grayBorder shadow-lg z-40 w-96 max-h-96 overflow-y-auto">
            <div class="space-y-2">
                <div class="font-bold text-sm mb-3">System Prompts</div>
                <div id="system-prompt-list" class="space-y-2"></div>
                <div class="border-t border-slate-200 dark:border-grayBorder pt-3 mt-3">
                    <button onclick="openCustomPromptModal()" class="text-xs px-2 py-1 rounded bg-accent text-accentText w-full font-bold">+ Create Custom</button>
                </div>
            </div>
        </div>
        
        <div id="create-group-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center">
            <div class="bg-white dark:bg-grayPanel p-6 rounded-2xl border border-slate-200 dark:border-grayBorder shadow-2xl">
                <h2 class="text-lg font-bold mb-4">Create Group</h2>
                <input type="text" id="group-name-input" class="w-full p-2 rounded border border-slate-300 dark:border-grayBorder bg-white dark:bg-black text-sm outline-none mb-4" placeholder="Group name" autofocus>
                <div class="flex justify-end gap-2">
                    <button onclick="closeCreateGroupModal()" class="px-4 py-2 text-sm opacity-60">Cancel</button>
                    <button onclick="createGroup()" class="px-4 py-2 text-sm bg-accent text-accentText rounded-lg font-bold">Create</button>
                </div>
            </div>
        </div>
        
        <div id="custom-prompt-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center">
            <div class="bg-white dark:bg-grayPanel p-6 rounded-2xl w-full max-w-2xl border border-slate-200 dark:border-grayBorder shadow-2xl">
                <h2 class="text-xl font-bold mb-4">Custom System Prompt</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold mb-1">Name</label>
                        <input type="text" id="custom-prompt-name" class="w-full p-2 rounded border border-slate-300 dark:border-grayBorder bg-white dark:bg-black text-sm outline-none" placeholder="e.g., Doctor">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">Category</label>
                        <input type="text" id="custom-prompt-category" class="w-full p-2 rounded border border-slate-300 dark:border-grayBorder bg-white dark:bg-black text-sm outline-none" placeholder="e.g., Medical">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">Prompt</label>
                        <textarea id="custom-prompt-content" rows="6" class="w-full p-2 rounded border border-slate-300 dark:border-grayBorder bg-white dark:bg-black text-sm outline-none custom-scrollbar" placeholder="Enter your system prompt here..."></textarea>
                    </div>
                </div>
                <div class="flex justify-end gap-2 pt-6 border-t border-slate-200 dark:border-grayBorder mt-6">
                    <button onclick="closeCustomPromptModal()" class="px-4 py-2 text-sm opacity-60">Cancel</button>
                    <button onclick="saveCustomPrompt()" class="px-4 py-2 text-sm bg-accent text-accentText rounded-lg font-bold">Save</button>
                </div>
            </div>
        </div>
        
        <div id="chat-container" class="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-6 flex flex-col"></div>
        
        <div class="p-6 bg-white dark:bg-blackBg border-t border-transparent dark:border-grayBorder">
            <div class="max-w-4xl mx-auto relative">
                <textarea id="user-input" rows="1" class="w-full p-4 pr-12 rounded-xl border border-slate-200 dark:border-grayBorder bg-slate-50 dark:bg-zinc-900 focus:ring-2 focus:ring-white outline-none resize-none custom-scrollbar max-h-48 overflow-y-auto" placeholder="Ask anything..." ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)"></textarea>
                <input type="file" id="file-input" class="hidden" accept=".md,.txt,.pdf,.jpg,.jpeg,.png,.gif,.webp" onchange="handleFileUpload(event)">
                <button onclick="document.getElementById('file-input').click()" class="absolute right-12 bottom-3 p-2 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">📎</button>
                <button id="send-btn" onclick="sendMessage()" class="absolute right-3 bottom-3 p-2 bg-accent text-accentText rounded-lg hover:opacity-90 transition-opacity disabled:opacity-50 disabled:cursor-not-allowed">
                    <span id="btn-icon">↑</span>
                </button>
                <button id="stop-btn" onclick="stopGeneration()" class="hidden absolute right-14 bottom-3 p-2 bg-red-500 text-white rounded-lg hover:opacity-90 transition-opacity">⏹</button>
            </div>
        </div>
        
    </main>

    <div id="settings-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-white dark:bg-grayPanel p-6 rounded-2xl w-full max-w-2xl border border-slate-200 dark:border-grayBorder shadow-2xl max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Provider Configuration</h2>
                <button onclick="addProviderRow()" class="px-3 py-1 bg-accent text-accentText text-xs rounded-md font-bold">+ Add Provider</button>
            </div>
            <div id="providers-container" class="space-y-6"></div>
            <div class="flex justify-end gap-2 pt-6 border-t border-slate-200 dark:border-grayBorder mt-6">
                <button onclick="toggleSettings(false)" class="px-4 py-2 text-sm opacity-60">Cancel</button>
                <button onclick="saveAllSettings()" class="px-4 py-2 text-sm bg-accent text-accentText rounded-lg font-bold">Save Configuration</button>
            </div>
        </div>
    </div>

    <!-- Your custom logic script -->
    <script src="/static/script.js"></script>
</body>
</html>
